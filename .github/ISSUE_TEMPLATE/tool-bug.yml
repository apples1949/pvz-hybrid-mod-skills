name: 工具缺陷（生成器 / 工具链跑不通）
description: tools/ 下的脚本报错、产物不正确、离线闸门失败
title: "[工具] "
labels: ["bug", "tools"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请确认：① 已按 `tools/README.md` 完成**环境适配**（解包后的游戏目录 + 路径改写）；
        ② 已跑过默认参数以建立基线；③ **一个 Issue 只讲一件事**。

  - type: dropdown
    id: tool
    attributes:
      label: 涉及哪个工具
      options:
        - tools/pmod-toolchain/build_pmod.py（打包）
        - tools/pmod-toolchain/verify_pmod.py（离线校验）
        - tools/pmod-toolchain/patch_pmod_attrs.py + pmod.bat（数值热补丁）
        - tools/pmod-toolchain/mod_editor.py（游戏外 GUI 编辑器）
        - tools/plant/build_plant_super_gatling.py（植物生成器）
        - tools/zombie/*（僵尸生成器）
        - tools/map/build_map_vampire_pool.py（地图生成器）
        - tools/skin/*（经典 reanim → 官方外观管线）
        - gates / 离线闸门
        - 其他（请在下方说明）
    validations:
      required: true

  - type: input
    id: cmd
    attributes:
      label: 完整命令
      description: 请粘贴原样命令（含参数与工作目录）
      placeholder: 例：python tools/pmod-toolchain/verify_pmod.py build/xxx.pmod
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果（完整报错 / 堆栈）
      description: 请粘贴完整输出，不要只贴最后一行；涉及产物错误请附路径与校验值
      render: text
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 最小复现步骤
      description: 从干净环境开始，能稳定复现的最短路径
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 环境
      description: 游戏版本 / 构建器版本 / Python 或 .NET 或 Godot 版本 / 操作系统
      placeholder: 游戏 V0.28；Python 3.13；.NET 9；Windows 11
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息（可选）
      description: 是否只在特定模型/角色/地图上出现？是否改过路径配置？日志文件路径？
    validations:
      required: false

  - type: checkboxes
    id: precheck
    attributes:
      label: 提交前自查
      options:
        - label: 我已阅读 CONTRIBUTING.md 的 Issue 规范
          required: true
        - label: 我已按 tools/README.md 完成环境适配，并用默认参数跑过基线
          required: true
        - label: 我粘贴的是完整输出而非节选
          required: true
